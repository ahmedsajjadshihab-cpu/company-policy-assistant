services:
  - type: web
    name: company-policy-assistant
    runtime: node
    plan: free
    branch: main
    buildCommand: npm run install:all && npm run build
    startCommand: npm --prefix backend start
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GROQ_API_KEY
        sync: false
